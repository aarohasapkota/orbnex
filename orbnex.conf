# ═══════════════════════════════════════════════════════════════
#  ORBNEX — a nexus of orbs
#  6-orb grid per window · runs on its own tmux server (-L orbnex)
# ═══════════════════════════════════════════════════════════════

# ─── Core behavior ────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:RGB"
set -g mouse on
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g display-time 1500

# ─── Tabs: every tab is a 6-orb grid that adapts to screen size ──
# prefix+c = new tab (grid of 6, same folder)
bind c run-shell "$HOME/.local/bin/orbnex newtab '#{session_name}'"

# prefix+C = plain single-pane tab, when you want one big orb
bind C new-window -c "#{pane_current_path}"

# prefix+g = re-fit the grid to the current screen size
bind g run-shell "$HOME/.local/bin/orbnex reflow '#{window_id}'"

# prefix+t = toggle the tab-manager sidebar (dock left/right via `orbnex dock`)
bind t run-shell "$HOME/.local/bin/orbnex dock toggle '#{session_name}'"

# prefix+b = flip the tab strip between top and bottom
bind b run-shell "$HOME/.local/bin/orbnex bar toggle"

# prefix+w = tab overview
bind w choose-tree -Zw

# Auto-adapt: re-fit grids when the terminal resizes or attaches,
# and keep the tab-manager dock glued to the active tab
set-hook -g client-resized { run-shell "$HOME/.local/bin/orbnex reflow" }
set-hook -g client-attached { run-shell "$HOME/.local/bin/orbnex reflow" }
set-hook -g session-window-changed { run-shell "$HOME/.local/bin/orbnex dock-sync" }

# Chrome-style mouse on the tab strip: click = switch (default),
# middle-click = close tab, click ＋ on the right = new tab
bind -n MouseDown2Status kill-window -t =
bind -n MouseDown1StatusRight run-shell "$HOME/.local/bin/orbnex newtab '#{session_name}'"
bind -n DoubleClick1StatusDefault run-shell "$HOME/.local/bin/orbnex newtab '#{session_name}'"

# ─── Navigation ───────────────────────────────────────────────
# Option+arrows: jump between orbs, no prefix needed
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
# Option+1..9: jump straight to a window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
# prefix+z still zooms an orb fullscreen, prefix+z again restores

# Manual splits with the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# prefix+r = reload the nexus config
bind r source-file ~/.config/orbnex/orbnex.conf \; display-message "◉ ORBNEX · systems reloaded"

# ─── Look: arc-reactor palette ────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#0b1020,fg=#7dd3fc"

set -g status-left-length 40
set -g status-left "#[fg=#0b1020,bg=#22d3ee,bold] ◉ ORBNEX #[fg=#22d3ee,bg=#1e293b] #S #[fg=#1e293b,bg=#0b1020] "

set -g status-right-length 70
set -g status-right "#[fg=#22d3ee,bold] ＋ #[fg=#334155]│ #[fg=#64748b]⬡ #{session_windows} tabs #[fg=#334155]│ #[fg=#a78bfa]%a %d %b #[fg=#334155]│ #[fg=#22d3ee,bold]%H:%M "

setw -g window-status-format "#[fg=#64748b]  ○ #I·#W  "
setw -g window-status-current-format "#[fg=#0b1020,bg=#a78bfa,bold]  ◉ #I·#W  "
setw -g window-status-separator ""

# Orb borders + per-orb HUD title — molten orange
set -g pane-border-status top
set -g pane-border-format "#[fg=#9a3412] ⬡ #{pane_index} #[fg=#fb923c]#{pane_current_command} #[fg=#9a3412]"
set -g pane-border-style "fg=#9a3412"
set -g pane-active-border-style "fg=#ff8c00,bold"
set -g pane-border-lines heavy

# Dim inactive orbs slightly so the active one glows
setw -g window-active-style "bg=terminal"
setw -g window-style "bg=terminal"

set -g message-style "bg=#1e293b,fg=#22d3ee,bold"
set -g mode-style "bg=#22d3ee,fg=#0b1020"
set -g clock-mode-colour "#22d3ee"
